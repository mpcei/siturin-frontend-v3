<p-dialog *ngIf="isModalVisible" [(visible)]="isModalVisible"
          [modal]="true"
          [closable]="false"
          [contentStyle]="{'height':'100vh', 'padding':'10'}"
          [style]="{'width':'90vw', 'height':'100vh', 'top':'0', 'left':'0'}"
          [breakpoints]="{}"
          [baseZIndex]="10000">

  <app-validation-question (dataOut)="checkValidationQuestions($event)"></app-validation-question>

  <div class="p-fluid">
    <div class="grid formgrid">
      <div class="field xl:col-6 lg:col-6 md:col-6 sm:col-12 col-offset-3">
        <button pButton pRipple label="Guardar" class="p-button-primary"
                [loading]="cargando"
                icon="pi pi-save"
                [disabled]="validationQuestions.length === 0"
                (click)="saveValidationQuestions()"></button>
      </div>
    </div>
  </div>
</p-dialog>
