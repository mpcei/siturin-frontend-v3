<div class="custom-form-card">
    <div class="custom-form-section mb-4 text-primary text-xl border-b pb-2">Gestión de Usuarios Internos</div>

    <p-table
        [value]="items()"
        [loading]="isLoading()"
        [paginator]="true"
        [rows]="pagination.limit || 10"
        [lazy]="true"
        (onLazyLoad)="loadData($event.first / $event.rows + 1)"
        [totalRecords]="pagination.totalItems || 0"
        styleClass="p-datatable-striped"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre Legal</th>
                <th>Fecha Inspección</th>
                <th
                    class="text-center"
                    style="width: 5rem"
                >
                    Reasignar Fecha
                </th>
            </tr>
        </ng-template>

        <ng-template
            pTemplate="body"
            let-item
            let-rowIndex="rowIndex"
        >
            <tr>
                <td class="font-medium text-gray-800">{{item.legalEntity?.name}}</td>
                <td class="text-gray-600">{{ item.inspectionExpirationAt??'No Asignado' |date }}</td>

                <td class="text-center">
                    <p-button
                        [icon]="FontAwesome.CALENDAR_REGULAR"
                        pTooltip="Fecha"
                        styleClass="p-button-rounded p-button-text p-button-info  p-button-secondary"
                        (onClick)="onSelect(item.id)"
                    >
                    </p-button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td
                    colspan="5"
                    class="text-center p-8 text-gray-500"
                >
                    No se encontraron registros de usuarios.
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog
    header="Re agenda"
    [visible]="visible()"
    (visibleChange)="visible.set($event)"
    [modal]="true"
    [style]="{ width: '400px' }"
>
    <div class="flex flex-column gap-2 mt-3">
        <label
            for="inspectionDate"
            class="font-semibold"
            >Nueva fecha de inspección</label
        >
        <p-datepicker
            id="inspectionDate"
            [ngModel]="inspectionDate()"
            (ngModelChange)="inspectionDate.set($event)"
            [showIcon]="true"
            dateFormat="dd/mm/yy"
            appendTo="body"
        >
        </p-datepicker>
    </div>

    <ng-template pTemplate="footer">
        <p-button
            label="Cancelar"
            icon="pi pi-times"
            severity="secondary"
            (onClick)="visible.set(false)"
        />
        <p-button
            label="Guardar"
            icon="pi pi-check"
            (onClick)="saveinspectionDate()"
        />
    </ng-template>
</p-dialog>
