<div class="custom-form-card">
    <div class="custom-form-section mb-4 text-primary text-xl border-b pb-2">Gestión de Usuarios Internos</div>

    <p-table
        [value]="items()"
        [loading]="isLoading()"
        [paginator]="true"
        [rows]="pagination.limit || 10"
        [lazy]="true"
        (onLazyLoad)="loadData($event.first / $event.rows + 1)"
        [totalRecords]="pagination.totalItems || 0"
        styleClass="p-datatable-striped"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre Completo</th>
                <th>Email</th>
                <th class="text-center">Disponible</th>
                <th class="text-center">Estado</th>
                <th
                    class="text-center"
                    style="width: 5rem"
                >
                    Acciones
                </th>
            </tr>
        </ng-template>

        <ng-template
            pTemplate="body"
            let-item
            let-rowIndex="rowIndex"
        >
            <tr>
                <td class="font-medium text-gray-800">{{ item.name }} {{ item.lastname }}</td>
                <td class="text-gray-600">{{ item.email }}</td>

                <td class="text-center">
                    <p-tag
                        [severity]="item.internalUser?.isAvailable ? 'success' : 'danger'"
                        [value]="item.internalUser?.isAvailable ? 'Sí' : 'No'"
                    >
                    </p-tag>
                </td>

                <td class="text-center">
                    <p-tag
                        [severity]="item.internalUser?.enabled ? 'info' : 'warn'"
                        [value]="item.internalUser?.enabled ? 'Activo' : 'Inactivo'"
                    >
                    </p-tag>
                </td>

                <td class="text-center">
                    <p-button
                        icon="pi pi-cog"
                        styleClass="p-button-rounded p-button-text p-button-secondary"
                        (onClick)="onSelect(item, rowIndex)"
                    >
                    </p-button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td
                    colspan="5"
                    class="text-center p-8 text-gray-500"
                >
                    No se encontraron registros de usuarios.
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<app-button-action
    [buttonActions]="buttonActions"
    [enabled]="isButtonActionsEnabled"
    (isHide)="isButtonActionsEnabled = $event"
>
</app-button-action>

@if (isDpaModalVisible()) {
<app-assign-dpa
    [visible]="isDpaModalVisible()"
    [user]="selectedItem"
    [assignedDpas]="userDpas()"
    (visibleChange)="closeDpaModal()"
    (onAddDpa)="handleAddDpa($event)"
    (onRemoveDpa)="handleRemoveDpa($event)"
    (onToggleProcess)="handleToggleDpaProcess($event)"
    (onToggleEnabled)="handleToggleDpaEnabled($event)"
>
</app-assign-dpa>
}
