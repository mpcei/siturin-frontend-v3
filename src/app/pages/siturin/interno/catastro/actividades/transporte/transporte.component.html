<p-card header="Transporte Terrestres">
  <p-table dataKey="id"
           styleClass="p-datatable-striped"
           [value]="transporteTerrestreField.value"
           [columns]="columnasTransporteTerrestreTabla"
           [loading]="(cargado$|async)!">
    <ng-template pTemplate="caption">
      <div class="formgrid grid">
        <div class="field xl:col-9 lg:col-9 md:col-9 sm:col-12">

        </div>
<!--        <div class="field xl:col-3 lg:col-3 md:col-3 sm:col-12">-->
<!--          <button pButton type="button"-->
<!--                  class="p-button-success"-->
<!--                  label="Agregar Guía de Turismo"-->
<!--                  icon="pi pi-plus"-->
<!--                  (click)="mostrarDialogoNuevoCompaniasTransporteTuristico()">-->
<!--          </button>-->
<!--        </div>-->
      </div>
    </ng-template>
    <ng-template pTemplate="header" let-columns>
      <tr>
        <th *ngFor="let col of columns">
          {{col.header}}
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
      <tr>
        <td>
          {{rowData.tipo.nombre}}
        </td>
        <td>
          {{rowData.capacidad}}
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage" let-columns>
      <tr>
        <td [attr.colspan]="columns.length">
          {{messageService.paginatorNoRecordsFound}}
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
