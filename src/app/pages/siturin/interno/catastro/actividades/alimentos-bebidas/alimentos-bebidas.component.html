<p-panel header="Tipo de Establecimiento">
  <form [formGroup]="formulario" class="p-fluid">
    <div formGroupName="tramiteAlimentoBebida" class="formgrid grid">
      <div class="field xl:col-6 lg:col-6 md:col-6 sm:col-12">
        <label appLabel for="tipoEstablecimiento"
               label="Tipo de Establecimiento:"
               [required]="tipoEstablecimientoField"></label>
        <p-select id="tipoEstablecimiento"
                    dataKey="id"
                    formControlName="tipoEstablecimiento"
                    [options]="tipoEstablecimientos"
                    optionLabel="nombre"
                    [filter]="true"
                    filterBy="nombre"
                    placeholder="Seleccione">
        </p-select>
        <small appErrorMessage
               [errors]="tipoEstablecimientoField.errors"
               [touched]="tipoEstablecimientoField.touched"
               [dirty]="tipoEstablecimientoField.dirty">
        </small>
      </div>
      <div
        *ngIf="tipoEstablecimientoField.value?.codigo==='cadena' || tipoEstablecimientoField.value?.codigo==='franquicia'"
        class="field xl:col-6 lg:col-6 md:col-6 sm:col-12">
        <label appLabel for="nombreEstablecimiento"
               label="Nombre de la Franquicia o Cadena:"
               [required]="nombreEstablecimientoField"></label>
        <input pInputText id="nombreEstablecimiento" formControlName="nombreEstablecimiento">
        <small appErrorMessage
               [errors]="nombreEstablecimientoField.errors"
               [touched]="nombreEstablecimientoField.touched"
               [dirty]="nombreEstablecimientoField.dirty">
        </small>
      </div>
    </div>
<!--    <div formGroupName="tramiteAlimentoBebida" *ngIf="tipoEstablecimientoField.value?.codigo==='franquicia'" class="field">-->
<!--      <label appLabel for="tieneCertificadoConcesionFranquicia"-->
<!--             label="Al momento de la inspección se presentará la certificación de concesión de la franquicia:"-->
<!--             [required]="tieneCertificadoConcesionFranquiciaField"></label>-->
<!--      <p>-->
<!--        <p-toggleswitch id="tieneCertificadoConcesionFranquicia"-->
<!--                       formControlName="tieneCertificadoConcesionFranquicia"></p-toggleswitch>-->
<!--      </p>-->
<!--      <small appErrorMessage-->
<!--             [errors]="tieneCertificadoConcesionFranquiciaField.errors"-->
<!--             [touched]="tieneCertificadoConcesionFranquiciaField.touched"-->
<!--             [dirty]="tieneCertificadoConcesionFranquiciaField.dirty">-->
<!--      </small>-->
<!--    </div>-->
  </form>
</p-panel>

<p-card header="Capacidades del Establecimiento">
  <form [formGroup]="formulario" class="p-fluid">
    <div formGroupName="tramiteAlimentoBebida" class="formgrid grid">
      <div class="field xl:col-6 lg:col-6 md:col-6 sm:col-12">
        <label appLabel for="totalMesas"
               label="Mesas:"
               [required]="totalMesasField"></label>
        <p-inputNumber id="totalMesas" formControlName="totalMesas" [showButtons]="true" [min]="0"></p-inputNumber>
        <small appErrorMessage
               [errors]="totalMesasField.errors"
               [touched]="totalMesasField.touched"
               [dirty]="totalMesasField.dirty">
        </small>
        <p></p>
      </div>
      <div class="field xl:col-6 lg:col-6 md:col-6 sm:col-12">
        <label appLabel for="totalCapacidades"
               label="Capacidad en número de personas:"
               [required]="totalCapacidadesField"></label>
        <p-inputNumber id="totalCapacidades" formControlName="totalCapacidades" [showButtons]="true"
                       [min]="0"></p-inputNumber>
        <small appErrorMessage
               [errors]="totalCapacidadesField.errors"
               [touched]="totalCapacidadesField.touched"
               [dirty]="totalCapacidadesField.dirty">
        </small>
        <p></p>
      </div>
    </div>
  </form>
</p-card>

<p-card *ngIf="tiposServicio?.length" header="Tipos de Servicio">
  <div class="panel-messages-info field">
    <h3>Información</h3>
    <br>
    <p class="text-justify">
      Registre los tipos de servicio que ofrece su establecimiento.
    </p>
  </div>

  <form [formGroup]="formulario" class="p-fluid">
    <div formGroupName="tramiteAlimentoBebida" class="field">
      <label appLabel for="tiposServicio"
             label="Seleccione:"
             [required]="tiposServicioField"></label>
      <p-multiSelect
        id="tiposServicio"
        dataKey="id"
        formControlName="tiposServicio"
        [options]="tiposServicio"
        display="chip"
        [showClear]="true"
        optionLabel="nombre"
        filterBy="nombre"
        [filter]="true"
        (onChange)="alimentosBebidasOut.emit(formulario.value)"
        placeholder="Seleccione una o varias">
      </p-multiSelect>
      <small appErrorMessage
             [errors]="tiposServicioField.errors"
             [touched]="tiposServicioField.touched"
             [dirty]="tiposServicioField.dirty">
      </small>
      <p></p>
    </div>
  </form>
</p-card>

<p-card *ngIf="tiposCocina?.length" header="Tipos de Cocina">

        optionLabel="nombre"
        filterBy="nombre"
        [filter]="true"
        (onChange)="alimentosBebidasOut.emit(formulario.value)"
        placeholder="Seleccione una o varias">
      </p-multiSelect>
      <small appErrorMessage

             [touched]="tiposCocinaField.touched"

      </small>
      <p></p>
    </div>
  </form>
</p-card>
