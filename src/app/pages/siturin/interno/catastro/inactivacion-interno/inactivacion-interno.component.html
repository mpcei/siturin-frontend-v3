  <div class="field">
    <label appLabel for="tieneDeuda" label="¿Con Deuda?:"
           [required]="tieneDeudaField"></label>
    <p>
      <p-toggleswitch id="tieneDeuda" formControlName="tieneDeuda"></p-toggleswitch>
    </p>
    <small appErrorMessage
           [errors]="tieneDeudaField.errors"
           [touched]="tieneDeudaField.touched"
           [dirty]="tieneDeudaField.dirty">
    </small>
  </div>
  <div class="field">
    <label appLabel for="tipoCausaInactivacion" label="Tipo de Causa de la Inactivación:"
           [required]="tipoCausaInactivacionField"></label>
    <p-select id="tipoCausaInactivacion"
                formControlName="tipoCausaInactivacion"
                dataKey="id"
                [options]="tiposCausaInactivacion"
                optionLabel="nombre"
                [filter]="true"
                filterBy="nombre"
                placeholder="Seleccione">
    </p-select>
    <small appErrorMessage
           [errors]="tipoCausaInactivacionField.errors"
           [touched]="tipoCausaInactivacionField.touched"
           [dirty]="tipoCausaInactivacionField.dirty">
    </small>
  </div>
  <p-divider></p-divider>
  <div class="field">
    <label appLabel label="Causales de Inactivación:"
           [required]="causalesInactivacionField"></label>
    <br>
    <small appErrorMessage
           [errors]="causalesInactivacionField.errors"
           [touched]="causalesInactivacionField.touched"
           [dirty]="causalesInactivacionField.dirty">
    </small>
    <div *ngFor="let causalIncumplimiento of causalesInactivacion; let i= index" class="field mt-6">
      <p-checkbox
        [inputId]="'causalesIncumplimiento'+i"
        name="causalesIncumplimiento"
        [value]="causalIncumplimiento"
        [formControl]="causalesInactivacionField">
      </p-checkbox>
      <label [for]="'causalesIncumplimiento'+i" class="ml-2">{{ causalIncumplimiento.nombre! }}</label>
    </div>
  </div>
  <div class="field">
    <button pButton pRipple type="button" icon="pi pi-save" class="" label="Guardar" (click)="onSubmit()"></button>
  </div>
</form>
